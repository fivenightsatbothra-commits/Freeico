<!DOCTYPE html>
<html>
<head>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; border: none; overflow: hidden; background: #fafafa; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <!-- Natively embed the Freeico web app for infinite scalability -->
  <iframe id="app-frame" src="https://fivenightsatbothra-commits.github.io/Freeico/index.html?minimal=true"></iframe>
  <script>
    // Listen for cross-origin messages from the Freeico iframe
    window.addEventListener("message", (event) => {
      // Security: Only accept messages from our GitHub Pages origin
      if (event.origin !== "https://fivenightsatbothra-commits.github.io") return;

      const data = event.data;
      if (data && data.pluginMessage) {
        // Forward the message to the Figma backend (code.js)
        parent.postMessage({ pluginMessage: data.pluginMessage }, '*');
      }
    });
  </script>
</body>
</html>
