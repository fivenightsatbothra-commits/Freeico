<!DOCTYPE html>
<html>
<head>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fafafa;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Embedding the main web app in its Chrome Sidepanel configuration -->
  <iframe src="https://fivenightsatbothra-commits.github.io/Freeico/chrome.html"></iframe>
  
  <script>
    // Chrome Extension doesn't strictly need postMessage to inject SVG because 
    // users can just click "Copy SVG" inside the iframe and use their OS clipboard.
    // However, if we wanted to auto-download, we could trap it here, although 
    // the web app's `downloadFile` handles native file saving perfectly fine even inside Chrome sidepanels!
  </script>
</body>
</html>
