<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>freeico VS Code Plugin</title>
    <link rel="stylesheet" href="{{CSS_URI}}">
    <!-- Passing data URI to JS -->
    <script>window.DATA_BASE_URI = "{{DATA_URI}}";</script>
    <script src="{{COL_URI}}"></script>
    <style>
        /* VS Code specific adjustments */
        body { 
            font-family: var(--vscode-font-family); 
            color: var(--vscode-editor-foreground);
            background-color: var(--vscode-editor-background);
        }
        .header { background: var(--vscode-editorWidget-background); border-bottom: 1px solid var(--vscode-editorWidget-border); }
        h2 { color: var(--vscode-editor-foreground); }
        .input-wrapper input, .select-wrapper select {
            background-color: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border: 1px solid var(--vscode-input-border);
        }
        .icon-item {
            background: var(--vscode-editorWidget-background);
            border: 1px solid var(--vscode-editorWidget-border);
            color: var(--vscode-editor-foreground);
        }
        .icon-item:hover {
            border-color: var(--vscode-focusBorder);
        }
        .toast {
            background: var(--vscode-notifications-background);
            color: var(--vscode-notifications-foreground);
            border: 1px solid var(--vscode-notifications-border);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zm0 20l-10-5v-10l10 5 10-5v10l-10 5z"/></svg>
            <h2>freeico</h2>
        </div>
    </div>
    
    <div class="search-container">
        <div class="input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-input" placeholder="Search..." autocomplete="off" spellcheck="false">
        </div>
        <div class="select-wrapper">
            <select id="collection-select">
                <option value="all">All Collections</option>
                <!-- Dynamically populated -->
            </select>
        </div>
    </div>

    <div class="scroll-area">
        <div class="grid" id="icon-grid">
            <!-- Icons injected here -->
        </div>
        <div id="loading-state" class="loading-state">Loading index...</div>
    </div>

    <div id="toast" class="toast">Code inserted!</div>

    <script src="{{JS_URI}}"></script>
</body>
</html>
