<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | freeico</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #fafafa; }
        .rain-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .raindrop {
            position: absolute;
            top: -100px;
            animation: fall linear infinite;
            opacity: 0.15;
            transition: opacity 0.3s;
        }
        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }
        .content-404 {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .content-404 h1 {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ef4444 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            line-height: 1;
            letter-spacing: -0.05em;
            animation: zoomIn 0.8s var(--transition-snappy);
        }
        .content-404 h2 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            animation: fadeInUp 0.9s var(--transition-snappy);
        }
        .content-404 p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 40px;
            max-width: 500px;
            animation: fadeInUp 1s var(--transition-snappy);
        }
    </style>
</head>
<body>
    <div class="rain-container" id="rain-container"></div>
    
    <div class="content-404">
        <h1>404</h1>
        <h2>Icon Not Found</h2>
        <p>The page you're looking for seems to have gotten lost in our massive library of 300,000+ icons.</p>
        <a href="index.html" class="btn btn-primary" style="padding: 14px 32px; font-size: 1.1rem; border-radius: 999px; text-decoration: none; animation: fadeInUp 1.1s var(--transition-snappy);">
            Return to Safety
        </a>
    </div>

    <script>
        const SVGS = [
            '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>',
            '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>',
            '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line>',
            '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>',
            '<polygon points="12 2 2 22 12 15 22 22 12 2"></polygon>',
            '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>',
            '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline>',
            '<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>',
            '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>',
            '<line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line>'
        ];
        
        const COLORS = [
            '#ef4444', '#f97316', '#f59e0b', '#84cc16', '#22c55e', '#10b981', '#14b8a6', '#06b6d4', '#0ea5e9', '#3b82f6', '#6366f1', '#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#f43f5e'
        ];

        const container = document.getElementById('rain-container');
        const MAX_DROPS = 100;
        
        function createRaindrop() {
            if(container.children.length > MAX_DROPS) return;
            
            const drop = document.createElement('div');
            drop.className = 'raindrop';
            
            // Random properties
            const svgPath = SVGS[Math.floor(Math.random() * SVGS.length)];
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            const size = Math.floor(Math.random() * 40) + 20; // 20px to 60px
            const left = Math.random() * 100; // 0 to 100vw
            const duration = Math.random() * 5 + 3; // 3s to 8s fall time
            const delay = Math.random() * 2; // initial stagger
            
            drop.style.left = `${left}vw`;
            drop.style.animationDuration = `${duration}s`;
            drop.style.animationDelay = `${delay}s`;
            
            drop.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">${svgPath}</svg>`;
            
            container.appendChild(drop);
            
            // Recreate when animation completes
            setTimeout(() => {
                if(drop.parentNode) drop.parentNode.removeChild(drop);
                createRaindrop();
            }, (duration + delay) * 1000);
        }

        // Initialize burst of rain
        for(let i=0; i < 40; i++) {
            setTimeout(createRaindrop, Math.random() * 2000);
        }
    </script>
</body>
</html>
